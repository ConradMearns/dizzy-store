id: https://example.org/queries/get_drain_remaining
name: get_drain_remaining
description: 'What a node still holds (input: node_id): count and bytes of its ''present'' locations, and how many of those are not yet droppable (not safe elsewhere, pinned, or non-evictable) — the ones blocking its drain. Zero means it can be unplugged. Reader: UI/CLI.'
prefixes: {linkml: 'https://w3id.org/linkml/'}
default_range: string
imports: ['linkml:types']
classes:
  GetDrainRemainingInput:
    description: Input for get_drain_remaining
    attributes:
      node_id: {range: string, required: true}
  GetDrainRemainingOutput:
    description: Output for get_drain_remaining
    attributes:
      held_count: {range: integer, required: true}
      held_bytes: {range: integer, required: true}
      unsafe_count: {range: integer, required: true, description: held blobs not yet safe elsewhere}
