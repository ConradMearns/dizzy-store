id: https://example.org/environment
name: environment
prefixes: {linkml: 'https://w3id.org/linkml/'}
default_range: string
imports: ['linkml:types']
classes:
  store:
    description: 'This node''s config: node_id (stable, unique in the pool); cluster_id (unset until it founds or joins one); epoch (random, generated once when the device''s state is created — a wiped device gets a new one); root (the sharded <aa>/<bb>/<sha256> blob tree — on the server, the EXISTING cas/); state_dir (<root>/.store/: identity, log — what makes the device portable); tmp_dir and quarantine_dir (same filesystem as root, for staging and atomic moves); limit_bytes with high_watermark / low_watermark (fractions of it that start and stop eviction); the pacing knobs of principle 9 (live_window_s, max_dispatch_per_event, max_bytes_per_sec, scrub_bytes_per_sec); and chunk_threshold_bytes / chunk_size for the edge; min_free_bytes (principle 11; 0 = off); and min_evict_bytes (principle 11; blobs smaller than this are never evicted under pressure; 0 = off). Injected by the host from its layered configuration.'
    attributes:
      node_id: {range: string, required: true}
      cluster_id: {range: string, required: false}
      epoch: {range: string, required: true}
      root: {range: string, required: true}
      state_dir: {range: string, required: true}
      tmp_dir: {range: string, required: true}
      quarantine_dir: {range: string, required: true}
      limit_bytes: {range: integer, required: true}
      high_watermark: {range: float, required: true}
      low_watermark: {range: float, required: true}
      live_window_s: {range: integer, required: true}
      max_dispatch_per_event: {range: integer, required: true}
      max_bytes_per_sec: {range: integer, required: true}
      scrub_bytes_per_sec: {range: integer, required: true}
      chunk_threshold_bytes: {range: integer, required: true}
      chunk_size: {range: integer, required: true}
      min_free_bytes: {range: integer, required: false, description: the filesystem must keep this much free; absent or 0 = off}
      min_evict_bytes: {range: integer, required: false, description: blobs smaller than this are never evicted under pressure; absent or 0 = off}
  disk:
    description: 'How much room the filesystem under root has left for an ordinary (non-root) writer: free_bytes() — statvfs f_bavail, which excludes the blocks ext4 reserves for root. Host-implemented, because it is an observation of the machine and not a fact; a simulation supplies its own.'
    attributes:
      root: {range: string, required: false, description: 'informational: the directory whose filesystem is measured'}
  peers:
    description: 'A client for reaching other nodes by node_id over any private link — a Tailscale tailnet (stable names, NAT traversal) or an SSH tunnel. Addresses are the endpoints peers announce (a card''s endpoints are plain URLs), bootstrapped by seeds and by the endpoint hint a peer sends when it asks to be pulled; peers authenticate with a shared bearer token (or tailnet identity where available). The transport (HTTP: bucketed anti-entropy, ranged blob streaming) is the host''s.'
    attributes:
      seeds: {range: string, required: false, multivalued: true, description: bootstrap addresses for first contact}
