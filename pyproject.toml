# The store feature's project: an installable CLI (`uv tool install --editable ./store`
# gives `dizzy-store` on PATH, running live from this checkout — so `git pull` + a
# restart IS the update) and the dev/test environment (`uv run --project store pytest`).
# Element packages (store/lib/python-uv/<kind>/<name>/src) are put on sys.path by
# dizzy_store/_kit.py, so they need no per-element dependency entries — which is also why
# the install must stay editable until DIZZY's runtime-kit extraction lets it be a wheel.
[project]
name = "dizzy-store"
version = "0.1.0"
description = "Personal cloud storage replicator — runtime glue + scenario tests for store.feat.yaml"
requires-python = ">=3.11"
dependencies = [
  "gen_def",
  "gen_int",
  "dizzy",
  "dagstore",
  "sqlalchemy>=2",
  "pydantic>=2",
  "pyyaml>=6",
  # the real transport: peer + admin API (server), peer client
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.scripts]
dizzy-store = "dizzy_store.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dizzy_store"]

[dependency-groups]
dev = ["pytest>=8", "freezegun>=1.5"]

[tool.uv.sources]
gen_def = { path = "lib/python-uv/gen_def", editable = true }
gen_int = { path = "lib/python-uv/gen_int", editable = true }
# DIZZY's runtime kit (FeatGraph) and the DAG event store — repo-local for now
dizzy = { path = "../ext/dizzy", editable = true }
dagstore = { path = "../dagstore", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
