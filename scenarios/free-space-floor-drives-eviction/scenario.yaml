- cluster:
    # a 30 KB filesystem with 10 KB of the logger's own data on it; the floor is 8 KB; limit_bytes is NOT binding
    server: {role: hot, site: hetzner, wants: [], disk_capacity: 30KB, disk_other: 10KB, min_free_bytes: 8KB}
    laptop: {role: archive, site: home, wants: ['*']}
- sync: all
- {at: server, upload: "photo-{n}", count: 6, size: 2KB}
- sync: all
- {at: server, command: check_capacity}
# 12 KB of blobs: 8 KB free, exactly the floor — not under it
- claim: {at: server, query: get_node_usage, input: {node_id: server}, expect: {equals: {held_count: 6}}}

- {at: server, upload: photo-7, size: 2KB}
- sync: all
- {at: server, command: check_capacity}
# 6 KB free is under the floor. Relief restores it with a quarter to spare (10 KB free), so two
# blobs go — and only because the laptop provably holds them.
- claim: {at: server, query: get_node_usage, input: {node_id: server}, expect: {equals: {held_count: 5}}}
- claim: {at: laptop, query: get_node_usage, input: {node_id: laptop}, expect: {equals: {held_count: 7}}}
- claim: {at: server, query: get_at_risk_blobs, expect: empty}
